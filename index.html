<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Images of Yours — Turn your images into motion</title>
  <meta name="description" content="Images of Yours turns your still images into cinematic motion showcases. Pick a template, drop in your work, export in seconds — right in your browser." />
  <meta property="og:title" content="Images of Yours" />
  <meta property="og:description" content="Your images, set in motion. 59 templates, keyframe control, HD export." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://ioy.ai/" />
  <meta property="og:image" content="https://ioy.ai/og.png" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Images of Yours" />
  <meta name="twitter:description" content="Your images, set in motion. 59 motion templates, HD export, in your browser." />
  <link rel="canonical" href="https://ioy.ai/" />
  <meta name="robots" content="index, follow" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/src/style.css" />
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Images of Yours",
    "url": "https://ioy.ai/",
    "description": "Turn your still images into cinematic motion showcases. 59 templates, keyframe camera control, WebCodecs HD export — right in your browser.",
    "applicationCategory": "MultimediaApplication",
    "operatingSystem": "Any",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
    "slogan": "Your images, set in motion."
  }
  </script>
</head>
<body>
  <!-- Brand splash -->
  <div id="splash">
    <div class="splash-mark">
      <svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true">
        <rect width="64" height="64" rx="14" fill="currentColor"/>
        <rect x="9" y="21" width="32" height="32" rx="8.5" fill="none" stroke="var(--bg)" stroke-width="2.5" opacity="0.2"/>
        <rect x="15.5" y="14.5" width="32" height="32" rx="8.5" fill="none" stroke="var(--bg)" stroke-width="2.5" opacity="0.45"/>
        <clipPath id="sc">
          <rect x="23" y="8" width="32" height="32" rx="8.5"/>
        </clipPath>
        <g clip-path="url(#sc)">
          <rect x="23" y="8" width="32" height="32" fill="var(--bg)"/>
          <circle cx="32.5" cy="17.5" r="3.2" fill="currentColor"/>
          <path d="M23 42 L33 30.5 L38.5 36 L44 29.5 L55 40.5 L55 44 L23 44 Z" fill="currentColor"/>
        </g>
      </svg>
    </div>
    <h1 class="splash-title">Images of Yours</h1>
    <p class="splash-slogan">Your images, set in motion.</p>
    <p class="splash-hint">Click anywhere to start</p>
  </div>

  <header id="topbar">
    <div class="logo" title="Images of Yours">
      <svg class="logo-mark" width="24" height="24" viewBox="0 0 64 64" aria-hidden="true">
        <rect width="64" height="64" rx="14" fill="currentColor"/>
        <rect x="9" y="21" width="32" height="32" rx="8.5" fill="none" stroke="var(--panel)" stroke-width="2.5" opacity="0.2"/>
        <rect x="15.5" y="14.5" width="32" height="32" rx="8.5" fill="none" stroke="var(--panel)" stroke-width="2.5" opacity="0.45"/>
        <clipPath id="lc">
          <rect x="23" y="8" width="32" height="32" rx="8.5"/>
        </clipPath>
        <g clip-path="url(#lc)">
          <rect x="23" y="8" width="32" height="32" fill="var(--panel)"/>
          <circle cx="32.5" cy="17.5" r="3.2" fill="currentColor"/>
          <path d="M23 42 L33 30.5 L38.5 36 L44 29.5 L55 40.5 L55 44 L23 44 Z" fill="currentColor"/>
        </g>
      </svg>
      <span class="logo-text">Images of Yours</span>
    </div>
    <input id="proj-title" class="title-input" value="Untitled showcase" spellcheck="false" />
    <div class="top-actions">
      <button id="new-project-btn" class="icon-btn" title="New project">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <button id="open-project-btn" class="icon-btn" title="Open project (.ioy)">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M4 8V6a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      </button>
      <button id="save-project-btn" class="icon-btn" title="Save project (.ioy)">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M5 4h11l3 3v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M8 4v5h7V4M8 20v-6h8v6" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      </button>
      <button id="theme-btn" class="icon-btn" title="Appearance">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      </button>
      <button id="export-btn" class="primary-btn">Export</button>
    </div>
  </header>

  <div id="app">
    <!-- Templates -->
    <aside id="library">
      <div class="lib-head">Templates <span id="tpl-count"></span></div>
      <div id="tpl-list"></div>
    </aside>

    <!-- Stage -->
    <main id="stage">
      <div id="canvas-wrap"><canvas id="view"></canvas></div>

      <!-- Scene strip -->
      <div id="scene-strip">
        <span class="strip-label">Scenes</span>
        <div id="scene-bar"></div>
      </div>

      <div id="timeline">
        <div id="keyframes-panel">
          <div class="kf-row" data-track="zoom">
            <span class="kf-label">Zoom</span>
            <div class="kf-lane" id="kf-lane-zoom"></div>
          </div>
          <div class="kf-row" data-track="tilt">
            <span class="kf-label">Tilt</span>
            <div class="kf-lane" id="kf-lane-tilt"></div>
          </div>
        </div>
        <div id="transport">
          <button id="play-btn" class="round-btn" title="Play / Pause (Space)">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          </button>
          <button id="restart-btn" class="round-btn" title="Restart">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M4 5v6h6M20 12a8 8 0 1 1-2.34-5.66" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
          <input id="scrub" type="range" min="0" max="8" step="0.01" value="0" />
          <span id="time-readout">0.0s / 8.0s</span>
        </div>
      </div>
    </main>

    <!-- Inspector -->
    <aside id="inspector">
      <section class="card">
        <h3>Scene</h3>
        <label class="ctl">Duration <b id="scene-dur-val">8</b>s
          <input id="scene-duration" type="range" min="2" max="20" step="0.5" value="8" />
        </label>
        <label class="ctl">Transition to next
          <select id="scene-transition" class="select">
            <option value="crossfade">Crossfade</option>
            <option value="push">Push</option>
            <option value="zoom">Zoom Through</option>
            <option value="wipe">Diagonal Wipe</option>
            <option value="none">None (cut)</option>
          </select>
        </label>
      </section>
      <section class="card">
        <h3>Frame</h3>
        <div id="aspect-btns" class="segmented">
          <button data-a="16:9" class="on">16:9</button>
          <button data-a="4:3">4:3</button>
          <button data-a="1:1">1:1</button>
          <button data-a="4:5">4:5</button>
          <button data-a="9:16">9:16</button>
        </div>
      </section>
      <section class="card">
        <h3>Media <span class="head-badge"><span id="slot-count-label">12</span> slots</span></h3>
        <div class="stepper">
          <span class="stepper-label">Images / videos</span>
          <span class="step-ctl">
            <button id="count-dec" class="step-btn">−</button>
            <b id="count-val">12</b>
            <button id="count-inc" class="step-btn">+</button>
          </span>
        </div>
        <div id="slots"></div>
        <div class="media-actions">
          <button id="add-images-btn" class="secondary-btn">Add Media</button>
          <button id="demo-images-btn" class="tertiary-btn">Demo</button>
          <button id="clear-images-btn" class="tertiary-btn danger">Clear</button>
        </div>
      </section>
      <section class="card">
        <h3>Camera & Look</h3>
        <label class="ctl">Camera Zoom <b id="zoom-val">1.00</b> <button class="kf-add" data-track="zoom" title="Add keyframe at playhead">◇</button>
          <input id="kf-zoom" type="range" min="0.5" max="2.2" step="0.01" value="1" />
        </label>
        <label class="ctl">Scene Tilt <b id="tilt-val">0°</b> <button class="kf-add" data-track="tilt" title="Add keyframe at playhead">◇</button>
          <input id="kf-tilt" type="range" min="-60" max="60" step="1" value="0" />
        </label>
        <label class="ctl color-row">Background
          <input id="bg-color" type="color" value="#0b0d12" />
        </label>
      </section>
    </aside>
  </div>

  <!-- Export modal -->
  <div id="export-modal" class="modal hidden">
    <div class="modal-card">
      <h3>Export</h3>
      <p class="modal-sub">Offline HD render via WebCodecs — resolution and framerate independent.</p>
      <div class="export-grid">
        <label class="ctl">Format
          <span class="radio-row">
            <label><input type="radio" name="fmt" value="mp4" checked /> MP4</label>
            <label><input type="radio" name="fmt" value="webm" /> WebM</label>
          </span>
        </label>
        <label class="ctl">Resolution
          <select id="export-res" class="select">
            <option value="720p">720p</option>
            <option value="1080p" selected>1080p</option>
            <option value="1440p">1440p (2K)</option>
          </select>
        </label>
        <label class="ctl">Frame rate
          <select id="export-fps" class="select">
            <option value="30">30 fps</option>
            <option value="60" selected>60 fps</option>
          </select>
        </label>
      </div>
      <p class="note"><span id="engine-note"></span> · Duration: <span id="export-dur">8</span>s</p>
      <div id="export-progress-wrap" class="hidden">
        <div id="export-progress"></div>
      </div>
      <p id="export-status" class="note"></p>
      <div class="modal-actions">
        <button id="export-cancel" class="secondary-btn">Cancel</button>
        <button id="export-go" class="primary-btn">Start Export</button>
      </div>
    </div>
  </div>

  <input id="file-input" type="file" accept="image/*,video/*" multiple hidden />
  <input id="project-file-input" type="file" accept=".ioy,.glide,application/json" hidden />
  <div id="toast" class="hidden"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
